<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Warren Zhang — software, embedded systems, robotics, and interactive 3D work." />
  <meta name="theme-color" content="#0a0d11" />
  <title>Warren Zhang</title>
  <link rel="stylesheet" href="./styles.css?v=20" />
</head>
<body>
  <a class="skip-link" href="#workspace-nav">Skip to navigation</a>

  <div id="css3d-root" aria-hidden="true"></div>
  <canvas id="scene-canvas" aria-hidden="true"></canvas>
  <div class="screen-shade" aria-hidden="true"></div>

  <aside id="workspace-nav" class="workspace-nav" aria-label="Portfolio navigation">
    <div class="brand-block">
      <a href="#home/home" class="brand-link" data-jump-section="home">
        <strong>Warren Zhang</strong>
        <span>Computer Science · Waterloo</span>
      </a>
    </div>

    <nav id="sidebar-sections" class="sidebar-sections"></nav>

    <div class="sidebar-footer">
      <div class="social-row">
        <a href="https://github.com/banana1324" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/fuyuanzhang" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="https://www.youtube.com/@goosehjonk918" target="_blank" rel="noreferrer">YouTube</a>
      </div>

      <a href="./assets/resume.pdf" target="_blank" rel="noreferrer" class="resume-link">
        Resume ↗
      </a>
    </div>
  </aside>

  <header class="top-tools">
    <label class="search-shell" for="site-search">
      <span class="search-icon">⌕</span>

      <input
        id="site-search"
        type="search"
        placeholder="Search Warren's work..."
        autocomplete="off"
      />

      <kbd>⌘K</kbd>
    </label>

    <div class="top-links">
      <a href="https://github.com/banana1324" target="_blank" rel="noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/fuyuanzhang" target="_blank" rel="noreferrer">LinkedIn</a>
      <a href="https://www.youtube.com/@goosehjonk918" target="_blank" rel="noreferrer">YouTube</a>
      <a href="./assets/resume.pdf" target="_blank" rel="noreferrer">Resume</a>
    </div>
  </header>

  <div id="search-results" class="search-results" hidden></div>

  <div class="scene-hud scene-hud-left">
    <span class="live-dot"></span>
    <span id="scene-label">HOME · PERSONAL LAB</span>
  </div>

  <div class="scene-hud scene-hud-right">
    <span id="arm-status">Curator ready</span>
  </div>

  <div class="scene-controls">
    <button id="reset-view" type="button">Reset view</button>

    <button
      id="add-object"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      Add object
    </button>
  </div>

  <p class="scene-help">
    Drag to orbit · Shift+A add · G toss · R spin · X delete
  </p>

  <div id="add-menu" class="add-menu" role="menu" hidden>
    <div class="add-menu-title">
      <span>Add</span>
      <span>›</span>
      <span>Mesh</span>
    </div>

    <button type="button" role="menuitem" data-add="plane">
      <span>Plane</span>
      <kbd>1</kbd>
    </button>

    <button type="button" role="menuitem" data-add="cube">
      <span>Cube</span>
      <kbd>2</kbd>
    </button>

    <button type="button" role="menuitem" data-add="circle">
      <span>Circle</span>
      <kbd>3</kbd>
    </button>

    <button type="button" role="menuitem" data-add="sphere">
      <span>UV Sphere</span>
      <kbd>4</kbd>
    </button>

    <button type="button" role="menuitem" data-add="icosphere">
      <span>Icosphere</span>
      <kbd>5</kbd>
    </button>

    <button type="button" role="menuitem" data-add="cylinder">
      <span>Cylinder</span>
      <kbd>6</kbd>
    </button>

    <button type="button" role="menuitem" data-add="cone">
      <span>Cone</span>
      <kbd>7</kbd>
    </button>

    <button type="button" role="menuitem" data-add="torus">
      <span>Torus</span>
      <kbd>8</kbd>
    </button>

    <button type="button" role="menuitem" data-add="monkey">
      <span>Monkey</span>
      <kbd>9</kbd>
    </button>
  </div>

  <div id="screen-reader-live" class="sr-only" aria-live="polite"></div>

  <noscript>
    <div class="noscript">
      This portfolio requires JavaScript for its interactive 3D scene.
    </div>
  </noscript>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./script.js?v=20"></script>
</body>
</html>
